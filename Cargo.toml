[workspace]
resolver = "2"
members = ["crates/pu-core", "crates/pu-gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = ""

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
plist = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
